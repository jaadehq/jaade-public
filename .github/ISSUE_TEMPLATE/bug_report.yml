name: Bug report
description: Report a reproducible problem in Jaade.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a Jaade issue. Please include enough detail for us to reproduce it.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that reproduces the problem.
      placeholder: |
        1. Open ...
        2. Run ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Jaade version
      placeholder: "Example: 0.1.0"
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Example: macOS 15.5"
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Logs, screenshots, or links that help explain the issue.
