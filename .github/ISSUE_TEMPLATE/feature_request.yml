name: Feature request
description: Suggest an improvement or new capability for Jaade.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow, limitation, or use case should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like Jaade to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workaround or alternate design you have tried or considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, examples, or related tools that clarify the request.
